# main に push → 本番 ohako-beautyresort.com/lp/
# preview に push → 確認用 ohako-beautyresort.com/lp-preview/ (Slackで承認後に main へマージ)
name: Deploy LP variants
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
concurrency: deploy-lp-${{ github.ref_name }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ github.ref_name == 'main' && '/lp/' || '/lp-preview/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            base/**
            build.py
            README.md
            .gitignore
